<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d9de0"/>
      <stop offset="100%" stop-color="#2b5278"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f1f8"/>
    </linearGradient>
    <linearGradient id="moustacheGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#2b5278"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- House body (rounded rect) -->
  <rect x="116" y="190" width="280" height="210" rx="28" fill="url(#houseGrad)" opacity="0.95"/>

  <!-- Roof -->
  <path d="M96 210 L256 110 L416 210" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Door -->
  <rect x="216" y="270" width="80" height="130" rx="40" fill="#2b5278"/>
  <circle cx="280" cy="340" r="7" fill="#ffffff"/>

  <!-- Window left -->
  <rect x="140" y="250" width="52" height="52" rx="12" fill="#2b5278" opacity="0.85"/>

  <!-- Window right -->
  <rect x="320" y="250" width="52" height="52" rx="12" fill="#2b5278" opacity="0.85"/>

  <!-- ═══ MUSTACHE ═══ (the signature of Khan!) -->
  <!-- Mustache sits above the door, like a friendly face -->
  <path d="M180 258 Q215 282 256 268 Q297 282 332 258"
        fill="none" stroke="url(#moustacheGrad)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mustache curls -->
  <path d="M180 258 Q162 268 156 250"
        fill="none" stroke="url(#moustacheGrad)" stroke-width="18"
        stroke-linecap="round"/>
  <path d="M332 258 Q350 268 356 250"
        fill="none" stroke="url(#moustacheGrad)" stroke-width="18"
        stroke-linecap="round"/>

  <!-- Eyes (small windows become eyes!) -->
  <circle cx="176" cy="246" r="8" fill="#2b5278"/>
  <circle cx="336" cy="246" r="8" fill="#2b5278"/>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="420" rx="160" ry="14" fill="rgba(0,0,0,0.15)"/>
</svg>
